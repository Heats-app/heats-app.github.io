<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEATS – Neues Passwort</title>
<style>
body{margin:0;min-height:100vh;background:#0b0f0f;color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.bahnen{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.bahnen span{width:14px;height:56px;border-radius:8px;transform:skewX(-18deg)}
h1{font-size:44px;margin:0 0 6px;letter-spacing:1px}
h1 b{color:#FF7A45}
.slogan{color:#9aa5a2;margin:0 0 36px}
.karte{background:#171d1c;border-radius:22px;padding:26px;max-width:420px;margin:0 auto}
.karte h2{margin:0 0 14px;font-size:24px}
input{width:100%;box-sizing:border-box;padding:16px;border-radius:14px;border:none;background:#0b0f0f;color:#fff;font-size:17px;margin-bottom:12px}
button{width:100%;padding:16px;border:none;border-radius:30px;background:#FF7A45;color:#fff;font-size:18px;font-weight:700}
#info{color:#9aa5a2;margin-top:14px;font-size:16px;line-height:1.5}
</style>
</head>
<body>
<div>
<div class="bahnen"><span style="background:#FF7A45"></span><span style="background:#7FE0C0"></span><span style="background:#A99BFF"></span></div>
<h1>HE<b>A</b>TS</h1>
<p class="slogan">Sport zusammen. In deiner Stadt.</p>
<div class="karte">
<h2>🔑 Neues Passwort</h2>
<input id="pw1" type="password" placeholder="Neues Passwort (mind. 6 Zeichen)">
<input id="pw2" type="password" placeholder="Passwort wiederholen">
<button id="knopf">Passwort speichern</button>
<p id="info"></p>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mlblhvslnfxdjzhklqlj.supabase.co";
const SUPABASE_KEY = "sb_publishable_reNRJ88w9Dg6QpLlHKdafw_61h6ZJAH";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const info = document.getElementById("info");
document.getElementById("knopf").onclick = async () => {
  const p1 = document.getElementById("pw1").value;
  const p2 = document.getElementById("pw2").value;
  if (p1.length < 6) { info.textContent = "Mindestens 6 Zeichen bitte."; return; }
  if (p1 !== p2) { info.textContent = "Die Passwörter sind nicht gleich."; return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) { info.textContent = "Link abgelaufen. Bitte in der App nochmal „Passwort vergessen?“ tippen."; return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  info.textContent = error ? "Fehler: " + error.message : "✅ Gespeichert! Öffne die HEATS-App und melde dich mit dem neuen Passwort an.";
};
</script>
</body>
</html>
